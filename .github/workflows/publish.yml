name: Publish to GitHub Packages

# Lockstep release: all three artifacts share one version and are published together.
# Create a GitHub Release with tag `v<version>` (e.g. v1.2.0) to publish:
#   io.igrant:stackview-core, io.igrant:stackview, io.igrant:stackview-compose  (all at <version>)
on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish Libraries
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing all artifacts at version: $VERSION"

      - name: Publish to GitHub Packages
        run: |
          ./gradlew \
            :stackview-core:publishReleasePublicationToGitHubPackagesRepository \
            :stackview:publishReleasePublicationToGitHubPackagesRepository \
            :stackview-compose:publishReleasePublicationToGitHubPackagesRepository \
            -PVERSION_NAME=${{ env.VERSION_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
